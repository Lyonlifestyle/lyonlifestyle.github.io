<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ofertas - Lyon Lifestyle</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#fff;}

.img-skeleton {
  background: linear-gradient(90deg, #1a1a1a 25%, #2a2a2a 50%, #1a1a1a 75%);
  background-size: 200% 100%;
  animation: skeleton-loading 1.5s infinite;
}
@keyframes skeleton-loading {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

header{
position:sticky;top:0;background:#111;z-index:1000;
border-bottom:1px solid #D4AF37;padding:16px;
}
.title{color:#fff;font-size:20px;font-weight:bold;text-align:center;}
.title .dorado{color:#D4AF37;}
.subtitulo{color:#ccc;font-size:13px;text-align:center;margin-top:2px;}

.count{padding:16px 20px 4px;font-size:20px;font-weight:bold;}

.products{
display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px;
}
@media(min-width:900px){.products{grid-template-columns:repeat(4,1fr);}}

.card{position:relative;background:white;cursor:pointer;transition:.3s;}
.card:hover{transform:translateY(-3px);}
.img-wrap{position:relative;}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#f5f5f5;display:block;}

.badge{
position:absolute;top:10px;padding:5px 10px;border-radius:5px;
font-size:11px;font-weight:bold;color:#fff;z-index:2;
}
.badge-oferta{left:10px;background:#c0392b;}
.badge-nuevo{right:10px;background:#D4AF37;color:#111;}

.info{padding:10px 5px;}
.brand{font-size:16px;font-weight:bold;margin-bottom:4px;}
.name{font-size:14px;color:#555;margin-bottom:6px;}
.price{font-size:20px;font-weight:bold;color:#111;}
.precio-anterior{
font-size:14px;color:#999;text-decoration:line-through;
font-weight:normal;margin-right:6px;
}

.vacio{padding:40px 20px;text-align:center;color:#888;}
</style>
</head>
<body>

<header>
  <div class="title">🔥 <span class="dorado">OFERTAS</span></div>
  <div class="subtitulo">Se actualiza solo cuando un producto baja de precio</div>
</header>

<div class="count" id="contadorProductos">Productos</div>

<section class="products" id="gridProductos"></section>

<script src="productos-demo.js"></script>
<script>
  // ÚNICA línea que define esta página: productos con precio < precio original
  const enOferta = productos.filter(p => p.precio < p.precioOriginal);
  renderizarProductos(enOferta, 'gridProductos');

  if (enOferta.length === 0) {
    document.getElementById('gridProductos').outerHTML =
      '<div class="vacio">No hay ofertas activas por ahora.</div>';
  }
</script>

</body>
</html>
